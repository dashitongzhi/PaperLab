name: biorxiv-fetch
version: 0.1.0
stage:
  - topic
risk_level: low

inputs_schema:
  doi:
    type: string
    required: true

outputs_schema:
  preprint:
    type: string
    description: outputs/biorxiv/<doi>.json

depends_on:
  python: ">=3.11"

tests:
  - tests/test_smoke.py

entry_point: scripts/run.py
