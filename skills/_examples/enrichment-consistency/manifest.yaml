name: enrichment-consistency
version: 0.1.0
stage:
  - data
  - write
risk_level: medium

inputs_schema:
  de_table:
    type: string
    required: true
  tools:
    type: array
    enum: [gseapy_ora, gseapy_prerank, gprofiler]
    default: [gseapy_ora, gseapy_prerank, gprofiler]
  top_k:
    type: integer
    default: 10

outputs_schema:
  concordance_matrix:
    type: string
    description: outputs/concordance.csv
  disagreement_drivers:
    type: string
    description: outputs/drivers.json

depends_on:
  dsh_tools: [tool-bash]
  python: ">=3.11"
  packages: [gseapy>=1.1, pandas>=2.0]

tests:
  - tests/test_smoke.py
  - tests/test_oracle.py

entry_point: scripts/run.py
